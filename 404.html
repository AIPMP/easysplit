<!DOCTYPE html>
<html lang="ko">
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/easysplit/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="누가 누구에게 얼마를 보내면 되는지 정리해 주는 모임 정산기">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="모임 정산기">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>모임 정산기 EasySplit</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- 접속 카운터 (통계: VisitStats). GitHub Pages 주소에서 열렸을 때만 센다. -->
  <script>
    (function () {
      try {
        if (!/\.github\.io$/.test(location.hostname)) return;
        var APP = 'easysplit';
        var today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
        var isNew = false;
        try {
          var k = 'vc_day_' + APP;
          if (localStorage.getItem(k) !== today) { localStorage.setItem(k, today); isNew = true; }
        } catch (e) {}
        var src = /; wv\)/.test(navigator.userAgent) ? 'apk' : 'web';
        fetch('https://fderhgftwfsbaumlkxxe.supabase.co/rest/v1/rpc/track_visit', {
          method: 'POST', keepalive: true,
          headers: { 'apikey': 'sb_publishable_CegmHgYuVKWcXKoV54fiKg_ylq3F2xL', 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_app: APP, p_src: src, p_new: isNew })
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
